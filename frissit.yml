name: MLSZ Auto Frissites
on:
  schedule:
    # Szombat-vasarnap meccsidoben, 15 percenkent (cron UTC-ben)
    - cron: "*/15 10-17 * * 6,0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 lxml
      - run: python elo.py
      - run: |
          git config user.name "LVSC Bot"
          git config user.email "bot@lorincivsc.hu"
          git add elo.js
          git diff --cached --quiet && echo "Nincs valtozas." || (git commit -m "Auto elo frissites $(date +'%Y.%m.%d %H:%M')" && git push)
